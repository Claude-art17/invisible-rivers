<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗河 — 提交记录</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    background: #f5f5f5;
    color: #000;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-family: Georgia, 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 6px;
    margin-bottom: 6px;
  }
  .count { font-size: 12px; letter-spacing: 2px; color: #888; margin-bottom: 32px; }
  .divider { width: 48px; height: 1px; background: #000; margin-bottom: 36px; }
  .card { border-top: 1px solid #ddd; padding: 20px 0; }
  .card-time { font-size: 11px; color: #aaa; letter-spacing: 1px; margin-bottom: 14px; }
  .sec { margin-bottom: 16px; }
  .sec-title { font-size: 13px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
  .sec-text { font-size: 14px; line-height: 1.7; color: #333; margin-bottom: 8px; }
  .card-images { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-images img {
    max-width: 160px;
    max-height: 120px;
    border-radius: 2px;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: opacity 0.2s;
    object-fit: cover;
  }
  .card-images img:hover { opacity: 0.8; }
  .empty { text-align: center; color: #aaa; padding: 60px 0; font-size: 14px; letter-spacing: 2px; }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 2px; }
  .refresh { margin-bottom: 20px; }
  .refresh a {
    font-size: 11px; letter-spacing: 2px; color: #888; text-decoration: none;
    border: 1px solid #ccc; padding: 6px 14px; border-radius: 2px; transition: all 0.2s;
  }
  .refresh a:hover { background: #000; color: #fff; border-color: #000; }
</style>
</head>
<body>
<div class="wrap">
  <div class="refresh"><a href="index.html">&larr; 返回提交页</a></div>
  <h1>暗河</h1>
  <p class="count">提交记录</p>
  <div class="divider"></div>
  <div id="list"></div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <img src="" alt="">
</div>
<script>
(function() {
  var list = document.getElementById('list');
  var countEl = document.querySelector('.count');

  fetch('/.netlify/functions/list')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    countEl.textContent = data.length + ' 条提交';
    if (!data.length) {
      list.innerHTML = '<div class="empty">暂无提交记录</div>';
      return;
    }
    var html = '';
    data.forEach(function(s) {
      var time = s.created_at ? new Date(s.created_at).toLocaleString('zh-CN') : '';
      html += '<div class="card"><div class="card-time">' + time + '</div>';

      html += '<div class="sec"><div class="sec-title">1 · 记录你生成的投影</div>';
      html += imagesHtml(s.projection_image_urls);
      if (s.projection_text) html += '<div class="sec-text">' + esc(s.projection_text) + '</div>';
      html += '</div>';

      html += '<div class="sec"><div class="sec-title">2 · 分享一段关于“家”的记忆</div>';
      html += imagesHtml(s.home_image_urls);
      if (s.home_text) html += '<div class="sec-text">' + esc(s.home_text) + '</div>';
      html += '</div>';

      if (s.comment) {
        html += '<div class="sec"><div class="sec-title">3 · 对于作品的评价</div>';
        html += '<div class="sec-text">' + esc(s.comment) + '</div></div>';
      }

      html += '</div>';
    });
    list.innerHTML = html;
  })
  .catch(function() {
    list.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  });

  function imagesHtml(urls) {
    if (!urls || !urls.length) return '';
    var h = '<div class="card-images">';
    urls.forEach(function(url) {
      h += '<img src="' + url + '" onclick="event.stopPropagation();var lb=document.getElementById(\'lightbox\');lb.querySelector(\'img\').src=\'' + url + '\';lb.classList.add(\'show\')" loading="lazy">';
    });
    h += '</div>';
    return h;
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
</body>
</html>
